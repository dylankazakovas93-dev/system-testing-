# FROZEN TRIAL POLICY v1.
# Selection trials per experiment = |primary targets| x |models| x |states| = 4 x 3 x 2 = 24.
# There is NO generic MAX_TRIALS. There are exactly 24 predeclared selection opportunities.
#
# DATA STAGES (dates are supplied by the experiment, frozen in its manifest BEFORE any result):
#   DEVELOPMENT (IS)  -> everything research code may touch (event, features, targets, models, CV, stats, plots, reports)
#   CONFIRMATION OOS  -> one-shot, only after a manual human unlock (approvals/EXP_xxxx_OOS_APPROVAL.yaml)
#   FINAL LOCKBOX     -> sealed; no code path opens it
# "OOS" means ONLY the human-unlocked confirmation period. Internal cross-validation is DEVELOPMENT_CV.
version: v1
states: [UPPER_HALF, LOWER_HALF]
expected_trials_per_experiment: 24
max_experiments_per_campaign: 20
max_selection_trials_per_campaign: 480
seed: 1729
bootstrap_repetitions: 2000
permutation_repetitions: 2000
ci_level: 0.95
development_cv:
  label: DEVELOPMENT_CV
  scheme: purged_chronological_expanding_walk_forward
  K: 5                               # exactly 5 validation folds; the development events are cut into K+1 consecutive blocks
  block_definition: equal_model_eligible_event_count   # boundaries use event TIMESTAMPS only, snapped to exchange-local day starts
  training_rule: "event_time < validation_start AND effective_target_end < validation_start"
  effective_target_end: "max(candidate_claimed_target_end, frozen_declared_target_resolution)"
  min_outer_train_events: 300        # a fold below any minimum is SKIPPED / INSUFFICIENT_DATA; never lowered automatically
  inner_blocks: 5
  min_inner_train_events: 50
  min_inner_oof_events: 30
state_definition:
  threshold: median_of_inner_oof_scores   # training information only
  upper_half: "score > threshold  -> candidate action = event direction, target y"
  lower_half: "score < threshold  -> candidate action = opposite direction, target -y"
  ties: excluded_from_both_states
base_event_frequency_floor_per_week: 2.0
sensitivity:
  max_parameters: 2
  multipliers: [0.75, 1.25]
  max_probes: 4
single_direction_events_only: true   # all events of one v1 experiment share one direction; mixed -> separate _LONG / _SHORT experiments
shortlist:
  top_groups_reported: 5
oos:
  max_target_side_groups: 2          # MAX_OOS_TARGET_SIDE_GROUPS
  models_per_group: 3                # every approved group includes RIDGE, SPLINE and XGB
  one_shot: true
  approval_dir: approvals
cpcv:
  n_groups: 6
  n_test_groups: 2
  n_splits: 15                       # C(6,2)
  embargo: max_primary_target_horizon   # applied around every test/train boundary, in information time
  group_definition: equal_model_eligible_event_count   # chronological, boundaries snapped to exchange-local day starts
  pbo_diagnostic: documented_in_docs_CPCV_PBO_md_never_used_for_selection

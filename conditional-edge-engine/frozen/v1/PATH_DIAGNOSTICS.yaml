# FROZEN FORWARD-PATH & MONETISATION DIAGNOSTICS v1.   *** DIAGNOSTIC ONLY ***
# Nothing here is a selection trial. No result may promote, rescue, rank or alter an experiment. Hashed into every manifest.
# The experiment still has exactly 4 targets x 3 models x 2 states = 24 promotion-eligible selection trials.
version: v1
label: "DIAGNOSTIC ONLY — NOT A SELECTION TRIAL"
promotion_eligible: false
selection_trials_affected: 0

horizons_bars: [5, 15, 30, 60, 120]          # bar-count based (NQ 1m ~ 5m/15m/30m/60m/120m)
# Forward bars = first bars whose OPEN >= event_time (same information clock as TARGET_BANK). P0 = open of the first forward bar.
reference_price: open_of_first_forward_bar
# PATH_TIMESTAMP_INELIGIBLE (per event and horizon, decided from timestamps/session rules ONLY, never from outcomes):
#   the h forward bars are not consecutive in time, run past the data, or complete after the RTH close of the event's session.
# No wrap into the next session.
ineligible_label: PATH_TIMESTAMP_INELIGIBLE
eligible_events: model_eligible_events_only     # warm-up events (no finite RV_60 / features) are excluded and counted

direction: "d in {-1,+1} (single direction per experiment)"
formulas:
  directional_log_return: "R_dir(p) = d * log(p / P0)"
  endpoint: "p = close of the h-th forward bar"
  raw_return_points: "close_h - P0"
  raw_log_return: "log(close_h / P0)"
  long_MFE_points: "max_i(high_i - P0)"
  long_MAE_points: "min_i(low_i - P0)"
  short_MFE_points: "max_i(P0 - low_i)"
  short_MAE_points: "min_i(P0 - high_i)"
  MFE_log: "long: log((P0+MFE_points)/P0); short: -log((P0-MFE_points)/P0)"
  MAE_log: "long: log((P0+MAE_points)/P0); short: -log((P0-MAE_points)/P0)"
  ticks: "points / instrument.tick_size (read from the instrument config, never hard-coded)"
  path_dominance: "MFE_points + MAE_points (MAE <= 0)"
  bars_to_extreme: "1-based forward-bar index of the FIRST occurrence of the final extremum (a zero excursion on bar 1 counts as bar 1)"
  same_bar_extrema: "bars_to_MFE == bars_to_MAE (no intrabar ordering is inferred)"
# Volatility normalisation: ONE definition (the ONE-BAR RMS volatility scale derived from the already-frozen RV_60 feature).
sigma_ref:
  feature: RV_60
  formula: "sigma_ref = RV_60 / sqrt(60)"
  definition: "sigma_ref = RV_60 / sqrt(60), where RV_60 = sqrt(sum_{i=1..60} r_i^2) over the 60 one-minute log returns ending at the last bar completed by event_time (the frozen feature-engine RV_60); sigma_ref is the corresponding one-bar RMS log-return scale"
  units: one_bar_log_return
  sigma_points: "sigma_ref * P0"
  MFE_sigma: "MFE_log / sigma_ref"
  MAE_sigma: "MAE_log / sigma_ref"
  barrier_levels: "k*sigma_ref in directional log space: target when fav_log >= t*sigma_ref, stop when adv_log <= -s*sigma_ref"
  used_for: [MFE_sigma, MAE_sigma, first_passage_barriers, fixed_bracket_cells_64]
  alternative_normalisers: none
  fallback_to_raw_RV_60: none

percentiles:
  method: linear_interpolation             # numpy.percentile(method="linear") (Hyndman-Fan type 7)
  endpoint_summary: [mean, median, p25, p75, p5, p95, std]     # std = sample std, ddof=1
  excursion_summary: [mean, median, p75, p95]
  dominance_summary: [mean, median, p25, p75, fraction_gt_0, fraction_lt_0]
  time_summary: [mean, median, p75, p95]
  bracket_pnl_summary: [p5, p25, p50, p75, p95]
  no_other_percentiles: true

continuation:
  continuation: "directional_endpoint_return > 0"
  reversal: "directional_endpoint_return < 0"
  flat: "directional_endpoint_return == 0 (exact)"
  report: [numerator, denominator, rate]

first_passage:
  horizons_bars: [15, 30, 60, 120]
  levels_sigma: [0.5, 1.0, 1.5, 2.0]
  symmetric: "P(+k sigma before -k sigma) for k in levels_sigma"
  asymmetric_target_stop_sigma: [[1.0, 0.5], [2.0, 1.0], [0.5, 1.0], [1.0, 2.0]]   # exactly these four; no other ratios
  outcomes: [TARGET_FIRST, STOP_FIRST, AMBIGUOUS_SAME_BAR, NEITHER]
  same_bar_rule: "target and stop both touched inside the same bar (first touch) -> AMBIGUOUS_SAME_BAR; no winner is assumed"

bracket_surface:
  stops_sigma: [0.5, 1.0, 1.5, 2.0]
  targets_sigma: [0.5, 1.0, 1.5, 2.0]
  expiries_bars: [15, 30, 60, 120]
  n_cells: 64                                # 4 x 4 x 4; no 65th cell, no interpolation, no optimiser
  canonical_order: [expiry, stop, target]    # NEVER performance-ordered
  entry: P0
  outcomes: [TARGET, STOP, EXPIRED, AMBIGUOUS_SAME_BAR]
  expired_pnl: "mark-to-market at the expiry bar's close, in the event direction (points)"
  variants:
    CONSERVATIVE_RESULT: "AMBIGUOUS_SAME_BAR is counted as STOP (PRIMARY bracket output)"
    RAW_PATH_RESULT: "AMBIGUOUS_SAME_BAR is kept as its own outcome and EXCLUDED from pnl statistics (count reported); no winner assumed"
  R_unit: "1R = stop distance in points"
  costs_applied: false
  cost_banner: "GROSS — COSTS NOT APPLIED"
  selection_banner: "DIAGNOSTIC ONLY — NO BRACKET WAS SELECTED"
  forbidden_output_phrases: ["BEST BRACKET", "OPTIMAL STOP", "OPTIMAL TARGET", "RECOMMENDED BRACKET"]

stability:
  min_events_for_eligible_year: 20           # eligible calendar year (UTC year of event_time) for the year tables
  year_unit: utc_calendar_year
  fold_unit: DEVELOPMENT_CV_validation_fold

contexts:                                    # exactly these; repeated identical event sets are grouped, not recomputed
  - raw_base_event
  - "UPPER_HALF and LOWER_HALF for every primary target x model (DEVELOPMENT_CV pooled validation events)"
  - frozen_filter_ladder_steps_if_declared

diagnostic_statement: >-
  These statistics were viewed post-event-definition as diagnostics.
  They are not eligible to create or promote a candidate in this experiment.
  Any trading rule, threshold, bracket, horizon, percentile, or filter inspired by these diagnostics requires a NEW registered
  experiment or a separate monetisation study.
non_promotable_rule: "PATH DIAGNOSTICS ARE NON-PROMOTABLE: they never change candidate status, trial rank, group rank, the top-5 IS list, campaign BH/Bonferroni, human-approval eligibility or SELECTION HOLDOUT group ordering."
human_interpretation_rule: >-
  A human may approve, decline, or approve fewer than the eligible maximum from the deterministic eligible list. A human may NOT use a visually
  attractive path or bracket diagnostic to substitute a non-eligible or lower-ranked configuration that the engine did not place in the
  approval-eligible set. If diagnostics inspire a different rule, bracket, horizon, threshold or filter, a NEW experiment or a SEPARATE
  MONETISATION STUDY is required; there is no current-experiment promotion.
lifecycle: "IS (development) rows only; no SELECTION HOLDOUT / lockbox path diagnostics exist before the human campaign SELECTION HOLDOUT opening."
